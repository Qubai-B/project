<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Personal Income Tax Self-Assessment — Mock Portal</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<header>
  <h1>Personal Income Tax Self-Assessment</h1>
  <p>State Internal Revenue Service — demonstration portal, synthetic data only</p>
</header>
<main>
  <form id="tax_self_assessment" autocomplete="off">

    <fieldset>
      <legend>1. Taxpayer Identity</legend>
      <div class="row"><label for="last_name">Surname</label>
        <input id="last_name" name="last_name" value="{{ v.last_name }}"></div>
      <div class="row"><label for="first_name">First Name</label>
        <input id="first_name" name="first_name" value="{{ v.first_name }}"></div>
      <div class="row"><label for="date_of_birth">Date of Birth (DD/MM/YYYY)</label>
        <input id="date_of_birth" name="date_of_birth" value="{{ v.date_of_birth }}"></div>
      <div class="row"><label for="tin">Tax Identification Number (TIN)</label>
        <input id="tin" name="tin" value="{{ v.tin }}"></div>
      <div class="row"><label for="nin">National Identification Number (NIN)</label>
        <input id="nin" name="nin" value="{{ v.nin }}"></div>
    </fieldset>

    <fieldset>
      <legend>2. Residential Address</legend>
      <div class="row"><label for="address_line">Street Address</label>
        <input id="address_line" name="address_line" value="{{ v.address_line }}"></div>
      <div class="row"><label for="lga">Local Government Area</label>
        <input id="lga" name="lga" value="{{ v.lga }}"></div>
      <div class="row"><label for="state">State of Residence</label>
        <input id="state" name="state" value="{{ v.state }}"></div>
    </fieldset>

    <fieldset>
      <legend>3. Income and Bank Details</legend>
      <div class="row"><label for="annual_income">Annual Income (₦)</label>
        <input id="annual_income" name="annual_income" value="{{ v.annual_income }}"></div>
      <div class="row"><label for="bvn">Bank Verification Number (BVN)</label>
        <input id="bvn" name="bvn" value="{{ v.bvn }}"></div>
      <div class="row"><label for="bank_account">Bank Account Number (NUBAN)</label>
        <input id="bank_account" name="bank_account" value="{{ v.bank_account }}"></div>
      <div class="row"><label for="email">Email Address</label>
        <input id="email" name="email" value="{{ v.email }}"></div>
    </fieldset>

    <div class="actions">
      <button type="button" class="secondary" id="btn_back">Back</button>
      <button type="button" id="btn_next">Save and Continue</button>
    </div>
  </form>
</main>
<footer>Demonstration form — no real data is collected</footer>
</body>
</html>
